name: Release

on:
  push:
    branches: [main]
  # 既存タグの publish が失敗したときの手動リカバリ用。
  # main の package.json の version をそのまま npm に publish する。
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    needs: release-please
    # release PR がマージされて新リリースが作られたとき、または手動トリガ時に publish する。
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      # npm の Trusted Publishing (tokenless OIDC) は npm >= 11.5.1 が必要。
      # node 同梱 npm では足りないことがあるため最新へ上げる。pnpm publish は OIDC 非対応のため publish のみ npm CLI を使う。
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # トークン不要。id-token: write ＋ npm 側 Trusted Publisher 設定で OIDC 認証され、provenance も付与される。
      - run: npm publish --provenance --access public
